[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-flare-forecast"
version = "0.1.0"
description = "Tools for downloading and evaluating historical solar flare forecasts."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Kritika"}
]

keywords = [
    "solar-flare",
    "space-weather",
    "forecasting",
    "NASA",
    "CCMC",
    "LMSAL",
    "forecast-verification"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering"
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "matplotlib>=3.7.0"
]

[project.urls]
Homepage = "https://github.com/kkritika123/solar-flare-forecast"
Repository = "https://github.com/kkritika123/solar-flare-forecast"
Issues = "https://github.com/kkritika123/solar-flare-forecast/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["flare_scoreboard*"]