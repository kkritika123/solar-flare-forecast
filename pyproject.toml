[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-flare-forecast"
version = "0.1.0"
description = "Tools for downloading and evaluating solar flare forecasts."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Kritika"}
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "matplotlib>=3.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flare_scoreboard*"]